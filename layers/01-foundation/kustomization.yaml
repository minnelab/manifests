apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Keep your sort options here to ensure CRDs apply before instances
sortOptions:
  order: legacy
  legacySortOptions:
    orderFirst:
    - Namespace
    - CustomResourceDefinition
    - MutatingWebhookConfiguration
    - ValidatingWebhookConfiguration
    - ResourceQuota
    - StorageClass
    - ServiceAccount
    - PodSecurityPolicy
    - NetworkPolicy
    - Role
    - ClusterRole
    - RoleBinding
    - ClusterRoleBinding
    - ConfigMap
    - Secret
    - Endpoints
    - Service
    - LimitRange
    - PriorityClass
    - PersistentVolume
    - PersistentVolumeClaim
    - Deployment
    - StatefulSet
    - CronJob
    - PodDisruptionBudget


resources:
# Cert-Manager
- ../../common/cert-manager/overlays/kubeflow
# Istio
- ../../common/istio/istio-crds/base
- ../../common/istio/istio-namespace/base
- ../../common/istio/istio-install/overlays/oauth2-proxy

images:
- name: quay.io/jetstack/cert-manager-controller
  newName: maiacloudai/cert-manager-controller
  newTag: v1.19.4

- name: quay.io/jetstack/cert-manager-cainjector
  newName: maiacloudai/cert-manager-cainjector
  newTag: v1.19.4

- name: quay.io/jetstack/cert-manager-webhook
  newName: maiacloudai/cert-manager-webhook
  newTag: v1.19.4

- name: gcr.io/istio-release/install-cni
  newName: istio/install-cni
  newTag: "1.28.0"
